<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f26b1d" />
    <title>Second Serving — rescue surplus food</title>
    <meta name="description" content="Second Serving connects food donors with NGOs and volunteers so surplus food reaches people who need it instead of going to waste." />
    <link rel="canonical" href="https://secondserving.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Second Serving" />
    <meta property="og:title" content="Second Serving — rescue surplus food" />
    <meta property="og:description" content="Donate, claim and deliver surplus food. Connect donors, NGOs and volunteers in one place." />
    <meta property="og:url" content="https://secondserving.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="google-site-verification" content="pw_6rn-9T8NFMrXwle4OPtP-4usNJ9LI0HsJsQZ8msY" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app crashes before React renders (for example missing or invalid Supabase settings),
      // show the reason instead of leaving a blank page.
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (!root || root.hasChildNodes()) return;
        var box = document.createElement('pre');
        box.style.cssText = 'white-space:pre-wrap;margin:24px;padding:16px;border:1px solid #f26b1d;border-radius:12px;font:14px/1.5 system-ui,sans-serif;color:#1c1c1e';
        box.textContent = 'The app could not start.\n\n' + (e.message || 'Unknown error');
        root.appendChild(box);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
